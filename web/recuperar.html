
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - Peluquería Elegance</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="logo">Peluquería Elegance</div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <section class="login">
        <div class="formulario-login">

            <h1>Recuperar contraseña</h1>

            <p>
                Ingresa tu correo electrónico para
                solicitar un enlace de recuperación.
            </p>

            <form action="SolicitarRecuperacionServlet" method="POST">

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required>

                <button type="submit" class="btn-login">
                    Recuperar contraseña
                </button>

            </form>

            <p class="texto-registro">
                ¿Recordaste tu contraseña?
                <a href="login.html">Volver a iniciar sesión</a>
            </p>

        </div>
    </section>

  

</body>
</html>
