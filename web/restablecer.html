<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña - Peluquería Elegance</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="logo">Peluquería Elegance</div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <section class="login">
        <div class="formulario-login">

            <h1>Crear nueva contraseña</h1>

            <p>
                Escribe tu nueva contraseña para recuperar
                el acceso a tu cuenta.
            </p>

            <form action="RestablecerContrasenaServlet"
                  method="POST">

                <input type="hidden"
                       id="token"
                       name="token">

                <label for="contrasena">
                    Nueva contraseña
                </label>

                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       minlength="5"
                       autocomplete="new-password"
                       required>

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input type="password"
                       id="confirmar"
                       name="confirmar"
                       minlength="5"
                       autocomplete="new-password"
                       required>

                <button type="submit" class="btn-login">
                    Guardar nueva contraseña
                </button>

            </form>

            <p class="texto-registro">
                <a href="login.html">
                    Volver a iniciar sesión
                </a>
            </p>

        </div>
    </section>

    <script>
        const parametros = new URLSearchParams(
            window.location.search
        );

        const token = parametros.get("token");

        if (!token) {
            alert("El enlace de recuperación no es válido.");
            window.location.href = "recuperar.html";
        } else {
            document.getElementById("token").value = token;
        }
    </script>

</body>
</html>
