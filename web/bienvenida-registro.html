
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>¡Bienvenida! - Peluquería Elegance</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            box-sizing: border-box;
            background: #fff0f6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bienvenida-registro {
            background: white;
            width: 100%;
            max-width: 760px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 30px #0001;
            text-align: center;
            box-sizing: border-box;
        }

        .marca {
            color: #b83272;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 39px;
            color: #30202b;
            margin: 22px 0 12px;
        }

        .subtitulo {
            color: #80546b;
            font-size: 18px;
            line-height: 1.6;
        }

        .imagenes-bienvenida {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 20px;
            max-width: 560px;
            margin: 30px auto;
        }

        .imagenes-bienvenida img {
            display: block;
            width: 100%;
            height: 290px;
            object-fit: cover;
            border-radius: 16px;
        }

        .mensaje-exito {
            background: #fce4ef;
            color: #8c315c;
            padding: 15px 20px;
            border-radius: 15px;
            margin: 25px auto;
            max-width: 470px;
            font-weight: bold;
        }

        .boton-login {
            display: inline-block;
            background: #b83272;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 30px;
            transition: 0.3s ease;
        }

        .boton-login:hover {
            background: #932557;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .bienvenida-registro {
                padding: 30px 18px;
            }

            h1 {
                font-size: 29px;
            }

            .imagenes-bienvenida {
                gap: 10px;
            }

            .imagenes-bienvenida img {
                height: 200px;
            }

            .subtitulo {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="bienvenida-registro">

        <div class="marca">
            PELUQUERÍA ELEGANCE
        </div>

        <h1>
            ¡Bienvenida al club de las chicas con estilo! 💗
        </h1>

        <p class="subtitulo">
            Tu próxima versión favorita de vos empieza acá.
        </p>

        <div class="imagenes-bienvenida">

            <img src="img/nueva_clienta.jpeg"
                 alt="Gatito elegante con lentes">

            <img src="img/registro.jpeg"
                 alt="Perrito rodeado de flores">

        </div>

        <div class="mensaje-exito">
            ✨ ¡Tu cuenta fue creada correctamente!
        </div>

        <p class="subtitulo">
            Ya podés iniciar sesión y reservar
            tu próximo momento de belleza.
        </p>

        <a href="login.html" class="boton-login">
            Iniciar sesión
        </a>

    </main>

</body>
</html>
